name: Food_Kub CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration (CI - Test & Verify)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Python syntax compilation
        run: python -m compileall front_py blackend_py tests

      - name: Run automated unit tests (25 tests)
        run: python -B -m unittest discover -s tests -v

  cd:
    name: Continuous Deployment (CD - Render Deploy)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production deployment files
        run: |
          test -f render.yaml
          test -f start_render.sh
          test -f blackend_py/main.py
          test -f front_py/main.py
          echo "Deployment configuration verified."

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render Deploy Hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered successfully."
          else
            echo "Render auto-deploy active via GitHub branch integration (or set RENDER_DEPLOY_HOOK_URL secret)."
          fi

      - name: Generate Installation & Deployment Summary
        run: |
          echo "### 🚀 Food_Kub Automated CI/CD Report" >> "$GITHUB_STEP_SUMMARY"
          echo "| ขั้นตอน (Stage) | สถานะ (Status) | รายละเอียด (Details) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **1. Continuous Integration (CI)** | ✅ Passed | ติดตั้ง Dependencies, ตรวจ Syntax และผ่าน Unit Tests 25/25 ข้อ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **2. Continuous Deployment (CD)** | ✅ Ready / Deployed | ตรวจสอบ `render.yaml` & `start_render.sh` พร้อม Deploy ขึ้น Render |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
