{% extends "base.html" %}

{% block content %}
<h1>{{ title }}</h1>

<div class="admin-form">
    <h2>เพิ่มเมนูใหม่</h2>
    <form action="/admin/add" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>ชื่อเมนู</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>ราคา (บาท)</label>
            <input type="number" name="price" step="0.01" required>
        </div>
        <div class="form-group">
            <label>หมวดหมู่</label>
            <input type="text" name="category" required placeholder="เช่น จานเดียว, ต้มแกง">
        </div>
        <div class="form-group">
            <label>รูปภาพ</label>
            <input type="file" name="image" accept="image/*">
        </div>
        <button type="submit" class="btn-add">เพิ่มเมนู</button>
    </form>
</div>

<h2>รายการเมนูทั้งหมด</h2>
<table class="admin-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>ชื่อ</th>
            <th>ราคา</th>
            <th>หมวดหมู่</th>
            <th>รูป</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.price }} บาท</td>
            <td>{{ item.category }}</td>
            <td><img src="/static/images/{{ item.image }}" width="60"
                     onerror="this.src='https://placehold.co/60x60'"></td>
            <td>
                <form action="/admin/delete/{{ item.id }}" method="post" style="display:inline">
                    <button type="submit" class="btn-remove">ลบ</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
