{% extends "base.html" %}

{% block content %}
<h1>{{ title }}</h1>

<div class="category-bar">
    <a href="/" class="category-chip">ทั้งหมด</a>
    {% for cat in categories %}
    <a href="/category/{{ cat }}" class="category-chip">{{ cat }}</a>
    {% endfor %}
</div>

<div class="menu-grid">
    {% for item in items %}
    <div class="menu-card">
        <div class="menu-card-image">
            {% if "://" in item.image %}
            <img src="{{ item.image }}" alt="{{ item.name }}" onerror="this.src='https://placehold.co/300x200?text=Food'">
            {% else %}
            <img src="/static/images/{{ item.image }}" alt="{{ item.name }}" onerror="this.src='https://placehold.co/300x200?text=Food'">
            {% endif %}
        </div>
        <div class="menu-card-body">
            <h3>{{ item.name }}</h3>
            <p class="menu-price">{{ item.price }} บาท</p>
            <form action="/cart/add/{{ item.id }}" method="post">
                <button type="submit" class="btn-add">เพิ่มลงตะกร้า</button>
            </form>
        </div>
    </div>
    {% else %}
    <p>ไม่มีเมนูในหมวดหมู่นี้</p>
    {% endfor %}
</div>
{% endblock %}
