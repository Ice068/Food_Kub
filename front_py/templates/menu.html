{% extends "base.html" %}

{% block content %}
<h1>{{ title }}</h1>

<div class="category-bar">
    <a href="/" class="category-chip">ทั้งหมด</a>
    {% for cat in categories %}
    <a href="/category/{{ cat }}" class="category-chip">{{ cat }}</a>
    {% endfor %}
</div>

<div class="menu-grid">
    {% for item in items %}
    <div class="menu-card">
        <div class="menu-card-image">
            <img src="/static/images/{{ item.image }}" alt="{{ item.name }}"
                 onerror="this.src='https://placehold.co/300x200?text={{ item.name }}'">
        </div>
        <div class="menu-card-body">
            <h3>{{ item.name }}</h3>
            <p class="menu-price">{{ item.price }} บาท</p>
            <button
                class="btn-add"
                onclick="cart.addItem({{ item.id }}, '{{ item.name }}', {{ item.price }})">
                เพิ่มลงตะกร้า
            </button>
        </div>
    </div>
    {% else %}
    <p>ไม่มีเมนูในหมวดหมู่นี้</p>
    {% endfor %}
</div>
{% endblock %}
