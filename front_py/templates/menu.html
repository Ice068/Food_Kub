{% extends "base.html" %}

{% block content %}
<h1>{{ title }}</h1>

<div class="category-bar">
    <a href="/{{ table_query }}" class="category-chip">ทุกหมวดหมู่</a>
    {% for cat in categories %}
    <a href="/category/{{ cat }}{{ table_query }}" class="category-chip">{{ cat }}</a>
    {% endfor %}
</div>

<div class="menu-grid">
    {% for item in items %}
    <div class="menu-card">
        <div class="menu-card-image">
            <img src="{{ item.image | menu_image_url }}" alt="{{ item.name }}"
                 onerror="this.onerror=null;this.src='/static/images/menu-placeholder.svg'">
        </div>
        <div class="menu-card-body">
            <h3>{{ item.name }}</h3>
            <p class="menu-price">{{ item.price }} บาท</p>
            <form action="/cart/add/{{ item.id }}{{ table_query }}" method="post">
                <button type="submit" class="btn-add">เพิ่มลงตะกร้า</button>
            </form>
        </div>
    </div>
    {% else %}
    <p>ไม่มีเมนูในหมวดหมู่นี้</p>
    {% endfor %}
</div>
{% endblock %}
