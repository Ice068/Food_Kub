{% extends "base.html" %}

{% block content %}
<div class="cart-container">
    {% for item in cart_items %}
    <div class="cart-item">
        <div class="cart-item-info">
            <strong>{{ item.name }}</strong>
            <span>{{ item.price }} บาท / ชิ้น</span>
        </div>
        <div class="cart-item-controls">
            <form action="/cart/update/{{ item.id }}" method="post">
                <input type="hidden" name="quantity" value="{{ item.qty - 1 }}">
                <button type="submit">-</button>
            </form>

            <span>{{ item.qty }}</span>

            <form action="/cart/update/{{ item.id }}" method="post">
                <input type="hidden" name="quantity" value="{{ item.qty + 1 }}">
                <button type="submit">+</button>
            </form>

            <form action="/cart/remove/{{ item.id }}" method="post">
                <button type="submit" class="btn-remove">ลบ</button>
            </form>
        </div>
    </div>
    {% else %}
    <p class="empty-message">ยังไม่มีสินค้าในตะกร้า</p>
    {% endfor %}

    <div class="cart-summary">
        <p>ยอดรวมทั้งหมด: {{ total }} บาท</p>
        {% if cart_items %}
        <a href="/checkout" class="btn-checkout">ชำระเงิน</a>
        {% endif %}
        <form action="/cart/clear" method="post">
            <button type="submit" class="btn-clear">ล้างตะกร้า</button>
        </form>
    </div>
</div>
{% endblock %}
