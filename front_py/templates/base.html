<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | ระบบสั่งอาหาร</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <a href="/{{ table_query }}" class="logo">🍽️ Food Kub</a>
        <nav>
            <a href="/{{ table_query }}">เมนู</a>
            <a href="/cart{{ table_query }}" class="cart-link">
                🛒 ตะกร้า
                <span id="cart-count" class="cart-badge">{{ cart_count | default(0) }}</span>
            </a>
        </nav>
    </header>

    <main class="container">
        <div class="table-banner" role="status">
            {% if table_id is not none %}
            กำลังสั่งอาหาร: <strong>โต๊ะ {{ table_id }}</strong>
            {% else %}
            ยังไม่ได้ระบุโต๊ะ กรุณาสแกน QR Code ที่โต๊ะของคุณ
            {% endif %}
        </div>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 ระบบสั่งอาหาร — ตัวอย่างโปรเจกต์ FastAPI (OOP)</p>
    </footer>
</body>
</html>
