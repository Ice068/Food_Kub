<!DOCTYPE html>
<html lang="th">
{% block extra_head %}{% endblock %}

<style>
    .navbar {
        flex-wrap: wrap;
        gap: 12px;
    }

    .navbar nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .navbar nav a {
        margin-left: 0;
    }

    @media (max-width: 600px) {
        .navbar {
            padding: 16px;
        }
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | ระบบสั่งอาหาร</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">🍽️ Food Kub</a>
        <nav>
            <a href="/">เมนู</a>
            <a href="/#recommended">เมนูแนะนำ</a>
            <a href="/random">วงล้ออาหาร</a>

            <a href="/cart" class="cart-link">
                🛒 ตะกร้า
                <span id="cart-count" class="cart-badge">
                    {{ cart_count | default(0) }}
                </span>
            </a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 ระบบสั่งอาหาร — ตัวอย่างโปรเจกต์ FastAPI (OOP)</p>
    </footer>
</body>
</html>
